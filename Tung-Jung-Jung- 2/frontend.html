function spawnDVDImages(src) {
    const container = document.getElementById("dvdContainer");

        // Apply to BOTH style and data object

        img.style.top = y + "px";
        img.style.display = 'block';

        container.appendChild(img);
        dvdImages.push({ img, x, y, dx, dy });  // Now matches style exactly
    }
}
